version: '3.7'

services:
  rabbitmq:
    image: rabbitmq:3.8-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=new_stable_password_123 # We'll use the same stable pass for consistency
    restart: always

  redis:
    image: redis:5-alpine
    container_name: investai_cache
    ports:
      - "6379:6379"
    restart: always

  consumer:
    build: .
    command: ["python", "-u", "consumer.py"]
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_MASTER_KEY=${RABBITMQ_MASTER_KEY}
    restart: always

  audit_agent:
    build: .
    command: ["python", "-u", "audit_agent.py"]
    depends_on:
      - rabbitmq
      - redis
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_MASTER_KEY=${RABBITMQ_MASTER_KEY}
      - REDIS_HOST=redis
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_MASTER_KEY=${GOOGLE_MASTER_KEY}
    restart: always

  notification_agent:
    build: .
    command: ["python", "-u", "notification_agent.py"]
    depends_on:
      - rabbitmq
      - redis
    environment:
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_MASTER_KEY=${RABBITMQ_MASTER_KEY}
    restart: always

  producer:
    build: .
    command: ["python", "-u", "load_producer.py"]
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_MASTER_KEY=${RABBITMQ_MASTER_KEY}
    # Note: Producer will exit after sending trades, this is expected for our load test
